<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>

    <!--Unordered list -->
    <ul>
        <li>
            London <br>
            Moscow <br>
            Cairo <br>
            Nairobi <br>
            Bujumbura <br>
        </li> <br>
        <li>
            Europe <br>
            Asia <br>
            Africa <br>
            Africa <br>
            Africa <br>
        </li>

    </ul>

    <!-- Ordered list -->
    <!-- <ol type="1, a, A, i, I"></ol> -->
    <!-- you can add tags in the li h1-6, p etc -->
    <ol>
        <li> Mango </li>
        <li> Banana </li>
        <li> Tomato </li>
        <li> Cabbage </li>
        <li> Bison </li> <br>

        <li> Fruit </li>
        <li>Fruit</li>
        <li>Fruit</li>
        <li>Vegetable</li>
        <li>Protein</li>
        </li>
    </ol>

</body>

</html>
